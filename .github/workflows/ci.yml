name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 16 — целевая версия для VPS. Локально стоит 18;
        # схема не использует ничего, чего нет в 16, и CI это проверяет.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praktika
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HARVESTER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/praktika

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Линт
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Миграции туда и обратно
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Справочники
        run: uv run python -m harvester load-directories

      - name: Тесты
        run: uv run pytest
