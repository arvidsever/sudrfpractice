<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Судебная практика</title>
<style>
:root{--ink:#1B2430;--mute:#4A5668;--line:#DDE2E8;--navy:#16335A;--blue:#1F4E8C;--chip:#E3EBF7;--bg:#FBFBFA;--pill:#F2F3F5;--mark:#FFE58A}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 "PT Sans",system-ui,sans-serif;color:var(--ink);background:#fff}
a{color:var(--blue)}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
mark{background:var(--mark);color:inherit}
.serif{font-family:"PT Serif",Georgia,serif}
.sr{position:absolute;left:-9999px}
.muted{color:var(--mute)}
[hidden]{display:none!important}

/* поиск */
.box{display:flex;align-items:center;gap:8px;height:56px;border-radius:28px;background:var(--pill);padding:0 6px 0 22px}
.box.line{height:48px;border:2px solid var(--blue);background:#fff;border-radius:24px;padding-left:18px}
.box input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:18px}
.go{height:44px;padding:0 22px;border:0;border-radius:22px;background:var(--blue);color:#fff;font-weight:700}
.sugg{position:absolute;left:0;right:0;top:64px;z-index:5;background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(22,51,90,.18);padding:8px}
.sugg button{display:flex;gap:12px;align-items:baseline;width:100%;min-height:44px;text-align:left;border:0;background:none;border-radius:12px;padding:8px 14px}
.sugg button:hover,.sugg button.on{background:#F0F4FA}
.sugg small{flex:0 0 70px;text-transform:uppercase;letter-spacing:.05em;color:#6B7788;font-size:12px}
.sugg span{flex:1;min-width:0;overflow-wrap:anywhere}

/* главная */
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 24px}
#home header{align-self:stretch;display:flex;justify-content:flex-end;padding:16px 16px 0;gap:24px;font-size:15px}
#home h1{margin:22vh 0 28px;font-size:40px;color:var(--navy);text-align:center}
#home form{position:relative;width:100%;max-width:720px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin-top:40px}
.tiles button{width:96px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.tiles i{width:60px;height:60px;border-radius:16px;background:#E8EEF7;color:var(--blue);display:flex;align-items:center;justify-content:center}
.note{max-width:560px;margin:40px 0 0;font-size:14px;color:#6B7788;text-align:center;line-height:1.5}

/* выдача */
#res{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
#res>header{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
#res>header .logo{border:0;background:none;font-weight:700;font-size:20px;color:var(--navy);padding:8px 0}
#res form{position:relative;flex:1 1 360px;max-width:760px}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid #B5BFCC;background:#fff;font-size:14px;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tag{font-size:14px;background:var(--chip);border-radius:12px;padding:5px 12px}
.cols{flex:1;display:flex;flex-wrap:wrap;align-items:stretch}
.list{flex:1 1 440px;min-width:0;padding:12px 24px;border-right:1px solid var(--line)}
.pane{flex:1 1 440px;min-width:0;padding:24px;background:#fff}
.cov{font-size:14px;color:var(--mute);padding:4px 0 10px}
.card{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;background:none;padding:14px 12px;color:var(--ink)}
.card.on{border-left-color:var(--blue);background:#F0F4FA}
.card .m{font-size:13px;color:var(--mute)}
.card .t{font-size:17px;font-weight:700;color:var(--navy)}
.card .s{font-size:15px;line-height:1.45}
.card .o{font-size:13px;font-weight:700;color:var(--mute)}
.more{margin:16px 12px;min-height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:700}

/* акт */
.act h2{margin:6px 0 12px;font-size:22px;line-height:1.3}
.act .meta{font-size:13px;color:var(--mute)}
.act .links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;margin:12px 0}
.act pre{white-space:pre-wrap;font:17px/1.65 "PT Serif",Georgia,serif;margin:12px 0}
.act details{margin:12px 0;font-size:14px}
.act details pre{font:13px/1.5 ui-monospace,Menlo,monospace}
.act .kind{font-weight:700;margin-top:16px}
#actpage{max-width:820px;margin:0 auto;padding:16px 24px 48px}
#actpage .back{border:0;background:none;color:var(--blue);padding:12px 0;font-size:15px}

/* пусто */
.empty{max-width:760px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:24px}
.empty h1{margin:0;font-size:30px}
.callout{background:#F6F8FB;border:1px solid var(--line);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px}
.link{border:0;background:none;color:var(--blue);padding:10px 0;text-align:left;font-size:16px}

@media (max-width:760px){
  #home h1{margin-top:14vh;font-size:30px}
  .tiles{gap:8px}.tiles button{width:80px}
  #res>header,.bar,.list,.pane{padding-left:12px;padding-right:12px}
  .list{border-right:0}
  .bar{overflow-x:auto;flex-wrap:nowrap}.bar>*{flex:0 0 auto}
  .pane{display:none}
}
</style>
</head>
<body>
<div id="home" hidden>
  <header><a id="logout" href="/logout" style="text-decoration:none" hidden>Выйти</a></header>
  <h1 class="serif">Судебная практика</h1>
  <form data-form>
    <label class="sr" for="q0">Поиск по судебной практике</label>
    <div class="box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7788" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q0" autocomplete="off" placeholder="Норма, номер дела или слова из акта" autofocus>
      <button class="go" type="submit">Найти</button>
    </div>
    <div class="sugg" hidden></div>
  </form>
  <div class="tiles">
    <button type="button" data-fill="ст. "><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM9 11h6M9 15h6"/></svg></i>По норме</button>
    <button type="button" data-fill="88-"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg></i>По номеру дела</button>
    <button type="button" data-fill=""><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8c-2 0-3 1-3 3v3h4v-3H6M17 8c-2 0-3 1-3 3v3h4v-3h-2"/></svg></i>По фразе</button>
  </div>
  <p class="note">Кассация и апелляция общей юрисдикции, Верховный Суд РФ, Конституционный Суд РФ. Арбитражных судов, районных судов и мировых судей в корпусе нет.</p>
</div>

<div id="res" hidden>
  <header>
    <button class="logo serif" type="button" data-home>Судебная практика</button>
    <form data-form>
      <label class="sr" for="q1">Поиск</label>
      <div class="box line"><input id="q1" autocomplete="off"><button class="go" type="submit" style="height:36px;padding:0 18px">Найти</button></div>
      <div class="sugg" hidden></div>
    </form>
  </header>
  <div class="bar" id="bar"></div>
  <div class="cols" id="cols">
    <section class="list" id="list"></section>
    <aside class="pane act" id="pane"><p class="muted">Выберите акт в списке.</p></aside>
  </div>
  <div id="empty" hidden></div>
</div>

<div id="actpage" class="act" hidden></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.filter((k) => k != null));
  return e;
};
const INSTANCES = [["all", "Все суды"], ["kas", "Кассация"], ["ap", "Апелляция"], ["vs", "ВС РФ"], ["ks", "КС РФ"]];
const SORTS = [["relevance", "По релевантности"], ["date", "По дате"]];
const wide = () => matchMedia("(min-width:761px)").matches;

let state = { q: "", instance: "all", sort: "relevance" };
let rows = [], data = null, picked = null, loading = 0;

/* ---------- адрес = состояние ---------- */
function readUrl() {
  const p = new URLSearchParams(location.search);
  state = { q: p.get("q") || "", instance: p.get("i") || "all", sort: p.get("s") || "relevance" };
  return p.get("ref");
}
function go(next, { replace = false } = {}) {
  const p = new URLSearchParams();
  if (next.q) p.set("q", next.q);
  if (next.instance && next.instance !== "all") p.set("i", next.instance);
  if (next.sort && next.sort !== "relevance") p.set("s", next.sort);
  if (next.ref) p.set("ref", next.ref);
  const url = p.toString() ? "?" + p : location.pathname;
  history[replace ? "replaceState" : "pushState"](null, "", url);
  route();
}
addEventListener("popstate", route);

async function api(path, params) {
  const r = await fetch(path + "?" + new URLSearchParams(params));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

/* ---------- маршрутизация ---------- */
async function route() {
  const ref = readUrl();
  for (const id of ["home", "res", "actpage"]) $("#" + id).hidden = true;
  if (ref) { $("#actpage").hidden = false; return showActPage(ref); }
  if (!state.q) { $("#home").hidden = false; $("#q0").focus(); return; }
  $("#res").hidden = false;
  $("#q1").value = state.q;
  await search(0);
}

/* ---------- выдача ---------- */
async function search(offset) {
  const mine = ++loading;
  if (!offset) { $("#list").replaceChildren(el("div", { className: "cov" }, "Ищем…")); $("#empty").hidden = true; $("#cols").hidden = false; }
  try {
    const d = await api("/api/search", { q: state.q, instance: state.instance, sort: state.sort, offset });
    if (mine !== loading) return;
    data = d;
    rows = offset ? rows.concat(d.rows) : d.rows;
  } catch (e) {
    if (mine !== loading) return;
    data = { total: 0, rows: [], parsed: {}, error: String(e.message || e) };
    rows = [];
  }
  renderResults();
}

function renderBar() {
  const bar = $("#bar");
  bar.replaceChildren();
  const p = data.parsed || {};
  for (const n of p.norms || []) bar.append(el("span", { className: "tag" }, el("b", {}, "Норма "), n));
  if (p.number) bar.append(el("span", { className: "tag" }, el("b", {}, "Дело "), p.number));
  for (const [id, label] of INSTANCES)
    bar.append(el("button", { className: "chip" + (state.instance === id ? " on" : ""), type: "button", onclick: () => go({ ...state, instance: id }) }, label));
  const sort = el("button", { className: "chip", type: "button", style: "margin-left:auto", onclick: () => go({ ...state, sort: state.sort === "date" ? "relevance" : "date" }) },
    "Порядок: " + SORTS.find(([id]) => id === state.sort)[1]);
  bar.append(sort);
}

function renderResults() {
  renderBar();
  const empty = $("#empty"), cols = $("#cols");
  const none = !data.rows.length && !rows.length;
  empty.hidden = !none;
  cols.hidden = none;
  if (none) return renderEmpty();

  const list = $("#list");
  list.replaceChildren();
  const share = data.texts_share;
  list.append(el("div", { className: "cov" },
    el("b", { style: "color:var(--ink)" }, data.total == null ? "Много актов" : (data.capped ? "более " : "") + plural(data.total, "акт", "акта", "актов")),
    share != null ? ` · текст разобран у ${Math.round(share * 100)}% актов корпуса: поиск по словам видит только их` : ""));
  for (const r of rows) list.append(card(r));
  if (data.has_more) list.append(el("button", { className: "more", type: "button", onclick: () => search(rows.filter((r) => r.ref.startsWith("c|")).length) }, "Показать ещё"));
  if (wide() && !picked && rows.length) open(rows[0]);
}

function card(r) {
  const c = el("button", { className: "card" + (picked === r.ref ? " on" : ""), type: "button", onclick: () => open(r, true) },
    el("span", { className: "m" }, [r.court_title, r.number, fmtDate(r.date)].filter(Boolean).join(" · ")),
    el("span", { className: "t serif" }, r.about || r.outcome || r.number),
  );
  if (r.snippet) c.append(el("span", { className: "s" }, ...marked(r.snippet.replace(/\s+/g, " "))));
  const tail = [r.outcome && r.about ? r.outcome : null, r.has_act === false ? "текста акта нет" : null, r.in_supreme ? "дошло до ВС" : null].filter(Boolean);
  if (tail.length) c.append(el("span", { className: "o" }, tail.join(" · ")));
  c.dataset.ref = r.ref;
  return c;
}

function open(r, user = false) {
  picked = r.ref;
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("on", c.dataset.ref === r.ref));
  if (!wide()) return go({ ...state, ref: r.ref });
  const pane = $("#pane");
  pane.replaceChildren(el("p", { className: "muted" }, "Загрузка…"));
  api("/api/act", { ref: r.ref }).then((a) => { if (picked === r.ref) renderAct(pane, a, true); })
    .catch((e) => { if (picked === r.ref) pane.replaceChildren(el("p", {}, String(e.message))); });
}

/* ---------- акт ---------- */
async function showActPage(ref) {
  const root = $("#actpage");
  root.replaceChildren(el("p", { className: "muted" }, "Загрузка…"));
  try { renderAct(root, await api("/api/act", { ref }), false); }
  catch (e) { root.replaceChildren(backButton(), el("p", {}, String(e.message))); }
}
function backButton() {
  return el("button", { className: "back", type: "button", onclick: () => (history.length > 1 ? history.back() : go({ ...state })) }, state.q ? "← К результатам" : "← На главную");
}
function renderAct(root, a, inPane) {
  root.replaceChildren();
  if (!inPane) root.append(backButton());
  root.append(
    el("div", { className: "meta" }, [a.court_title, a.number, fmtDate(a.date), a.judge].filter(Boolean).join(" · ")),
    el("h2", { className: "serif" }, a.about || a.outcome || a.number),
  );
  const links = el("div", { className: "links" });
  if (inPane) links.append(el("a", { href: "?" + new URLSearchParams({ ...(state.q && { q: state.q }), ref: a.ref }) }, "Открыть целиком"));
  if (a.url) links.append(el("a", { href: a.url, target: "_blank", rel: "noopener noreferrer" }, "Оригинал на сайте суда ↗"));
  links.append(el("button", { className: "chip", type: "button", onclick: (e) => copyCite(a, e.target) }, "Скопировать реквизиты"));
  root.append(links);
  if (a.outcome && a.about) root.append(el("div", { className: "meta" }, "Результат: " + a.outcome));
  if (a.instances && a.instances.length)
    root.append(el("details", {}, el("summary", {}, "Движение дела по инстанциям"), el("pre", {}, a.instances.join("\n"))));
  const words = stems(data && data.parsed ? data.parsed.text : "");
  for (const t of a.texts) {
    if (a.texts.length > 1 && t.kind) root.append(el("div", { className: "kind" }, t.kind));
    root.append(el("pre", {}, ...highlight(t.text, words)));
  }
}
async function copyCite(a, btn) {
  const text = [a.court_title, a.number, a.date ? "от " + fmtDate(a.date) : ""].filter(Boolean).join(", ");
  try { await navigator.clipboard.writeText(text + (a.url ? "\n" + a.url : "")); btn.textContent = "Скопировано"; }
  catch { btn.textContent = "Не удалось скопировать"; }
  setTimeout(() => (btn.textContent = "Скопировать реквизиты"), 1500);
}

/* ---------- ничего не найдено ---------- */
function renderEmpty() {
  const box = $("#empty");
  box.replaceChildren();
  const tokens = state.q.split(/\s+/).filter(Boolean);
  const tries = el("div", { className: "row" });
  if (state.instance !== "all") tries.append(el("button", { className: "chip", type: "button", onclick: () => go({ ...state, instance: "all" }) }, "Искать во всех судах"));
  if (tokens.length > 1) for (const w of tokens.slice(-3))
    tries.append(el("button", { className: "chip", type: "button", onclick: () => go({ ...state, q: tokens.filter((x) => x !== w).join(" ") }) }, `Без слова «${w}»`));
  const popular = ["ст. 333 ГК неустойка", "ст. 395 ГК проценты", "неустойка явно несоразмерна последствиям"];
  box.append(el("main", { className: "empty" },
    el("div", {}, el("h1", { className: "serif" }, data.error ? "Не получилось выполнить запрос" : "Ничего не найдено"),
      el("p", { style: "overflow-wrap:anywhere" }, data.error ? data.error : `По запросу «${state.q}» нет актов, где встречаются все эти слова.`)),
    el("div", { className: "callout" }, el("b", {}, "Это не значит, что практики нет"),
      el("span", {}, "Поиск по словам видит только акты с разобранным текстом, у остальных ищет по реквизитам: номеру, суду, дате, норме."),
      el("span", {}, "Арбитражных судов, районных судов и мировых судей в корпусе нет.")),
    tries.children.length ? el("div", {}, el("b", {}, "Попробуйте"), tries) : null,
    el("div", {}, el("b", {}, "Частые запросы"), ...popular.map((q) => el("div", {}, el("button", { className: "link", type: "button", onclick: () => go({ ...state, q }) }, q))))));
}

/* ---------- подсказки ---------- */
function wireForm(form) {
  const input = $("input", form), box = $(".sugg", form);
  let timer, seq = 0, items = [], active = -1;
  const hide = () => { box.hidden = true; active = -1; };
  const paint = () => {
    box.replaceChildren(...items.map((s, i) => el("button", { type: "button", className: i === active ? "on" : "", onmousedown: (e) => { e.preventDefault(); input.value = s.q; submit(); } },
      el("small", {}, s.kind), el("span", {}, s.text), s.hint ? el("small", { style: "flex:none;text-align:right" }, s.hint) : null)));
    box.hidden = !items.length;
  };
  const submit = () => { const q = input.value.trim(); hide(); if (q) go({ ...state, q }); };
  form.onsubmit = (e) => { e.preventDefault(); if (active >= 0 && items[active]) input.value = items[active].q; submit(); };
  input.oninput = () => {
    clearTimeout(timer);
    const q = input.value.trim(), mine = ++seq;
    if (!q) { items = []; return hide(); }
    // Подсказки дешёвые, но не бесплатные: дело ищется по подстроке.
    timer = setTimeout(async () => {
      let found = [];
      try { found = await api("/api/suggest", { q }); } catch {}
      if (mine !== seq) return;
      items = [...found, { kind: "Везде", text: `Искать «${q}» в тексте актов`, hint: "Enter", q }];
      active = -1; paint();
    }, 150);
  };
  input.onkeydown = (e) => {
    if (box.hidden || !items.length) return;
    if (e.key === "ArrowDown") { active = (active + 1) % items.length; paint(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = (active - 1 + items.length) % items.length; paint(); e.preventDefault(); }
    else if (e.key === "Escape") hide();
  };
  input.onblur = () => setTimeout(hide, 120);
}
document.querySelectorAll("[data-form]").forEach(wireForm);
document.querySelectorAll("[data-fill]").forEach((b) => (b.onclick = () => { const i = $("#q0"); i.value = b.dataset.fill; i.focus(); i.dispatchEvent(new Event("input")); }));
document.querySelectorAll("[data-home]").forEach((b) => (b.onclick = () => go({})));

/* ---------- мелочи ---------- */
function fmtDate(d) { return d ? d.split("-").reverse().join(".") : ""; }
function plural(n, one, few, many) {
  const m = n % 100, k = n % 10;
  const w = m > 10 && m < 20 ? many : k === 1 ? one : k > 1 && k < 5 ? few : many;
  return `${n.toLocaleString("ru-RU")} ${w}`;
}
// «…» вокруг совпадения ставит ts_headline (search._snippet). Своя же
// кавычка-ёлочка в тексте акта подсветится зря — приемлемо для сниппета.
function marked(s) {
  return s.split(/(«[^»]*»)/).map((p, i) => (i % 2 ? el("mark", {}, p.slice(1, -1)) : p));
}
// Грубое «основа слова»: русская морфология в браузере не нужна, хватает
// корня без двух последних букв — подсветка подсказывает, а не доказывает.
function stems(text) {
  return (text || "").replace(/["'«»]|\bor\b|(^|\s)-\S+/gi, " ").split(/\s+/).filter((w) => w.length >= 4).map((w) => w.slice(0, Math.max(4, w.length - 2)).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
}
function highlight(text, words) {
  if (!words.length) return [text];
  const re = new RegExp("(" + words.map((w) => w + "[а-яё]*").join("|") + ")", "giu");
  return text.split(re).map((p, i) => (i % 2 ? el("mark", {}, p) : p));
}
